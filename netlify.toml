[build]
  publish = "."
  command = ""
  # Save credits: build only when the latest commit message contains [deploy]
  # (exit 0 = skip the build, exit 1 = build)
  ignore = "git log -1 --pretty=%B | grep -qF '[deploy]' && exit 1 || exit 0"

# Keep the generator sources and repo docs off the public site
[[redirects]]
  from = "/_src/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
